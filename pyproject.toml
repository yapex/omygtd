[project]
name = "gtd"
version = "1.0.0"
description = "单人 GTD 系统 MVP-1：本地 SQLite 真相源 + 看板 PNG 渲染"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gtd = "gtd.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gtd"]
